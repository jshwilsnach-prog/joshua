name = "nekyia"
main = "cloudflare/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[kv_namespaces]]
binding = "AUGHT"
id = "REPLACE_WITH_WRANGLER_KV_ID"

[[durable_objects.bindings]]
name = "WALK"
class_name = "WalkRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalkRoom"]
