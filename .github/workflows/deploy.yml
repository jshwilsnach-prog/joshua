name: Deploy house

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:house
      - name: House CSS scanned src
        run: |
          shopt -s nullglob
          css=(dist/assets/*.css)
          if [ ${#css[@]} -eq 0 ]; then
            echo "no built css"
            exit 1
          fi
          if ! grep -q '.inset-0{' "${css[@]}"; then
            echo "Tailwind missed src/: no .inset-0{"
            ls -l dist/assets/*.css
            wc -c dist/assets/*.css
            exit 1
          fi
      - name: Seed Aught
        if: hashFiles('aught-seed.txt') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          rows = []
          with open("aught-seed.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  day, hits = line.split()
                  rows.append({"key": f"day:{day}", "value": str(int(hits))})
          with open("aught-bulk.json", "w", encoding="utf-8") as out:
              json.dump(rows, out)
          PY
          npx --yes wrangler@4 kv bulk put aught-bulk.json --binding AUGHT --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Door serves this house
        run: bash scripts/check-door.sh
      - name: Live relay is rooms
        run: node scripts/live-walk.mjs
